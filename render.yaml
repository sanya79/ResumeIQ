services:
  # Frontend Static Site (100% Free)
  - type: web
    name: resumeiq-frontend
    runtime: static
    buildCommand: npm install --prefix resumeiq-frontend && npm run build --prefix resumeiq-frontend
    staticPublishPath: ./resumeiq-frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://resumeiq-backend-tlbw.onrender.com/api/v1
      - key: VITE_API_BASE_URL
        value: https://resumeiq-backend-tlbw.onrender.com/api/v1

  # Backend Web Service (100% Free Tier)
  - type: web
    name: resumeiq-backend
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://resumeiq-frontend1.onrender.com
